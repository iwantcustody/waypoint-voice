name: Build app

on:
  push:
    branches: [ main, master ]
    # Website-only updates (index.html) don't need a new app; the app loads the website.
    paths-ignore:
      - 'app/src/main/assets/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the app
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk Shotgun-${{ github.run_number }}.apk

      - name: Publish for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shotgun build ${{ github.run_number }}
          body: Open this page on your phone and tap the .apk file below to install or update.
          files: Shotgun-${{ github.run_number }}.apk
          make_latest: true
